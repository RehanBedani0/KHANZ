name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential libltdl-dev python3-pip ccache lld

      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip
          pip install --upgrade Cython==0.29.33 buildozer virtualenv

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Project .buildozer Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Build Debug APK
        run: |
          buildozer android debug 2>&1 | tee build.log
        timeout-minutes: 60

      - name: Show Build Log
        if: always()
        run: tail -100 build.log || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhanzAcademy-Debug-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
