name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential libltdl-dev \
            python3-pip python3-dev \
            ccache lld \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            ant

      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip wheel
          pip install --upgrade \
            Cython==0.29.33 \
            buildozer==1.5.0 \
            virtualenv

      - name: Cache Buildozer Global Dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Project .buildozer Dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-project-

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
        continue-on-error: true

      - name: Build Debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | buildozer android debug 2>&1 | tee build.log
        timeout-minutes: 60

      - name: Show Build Log (last 200 lines)
        if: always()
        run: |
          echo "=== LAST 200 LINES OF BUILD LOG ==="
          tail -200 build.log || echo "No build.log found"

      - name: List bin/ directory
        if: always()
        run: |
          echo "=== Contents of bin/ ==="
          ls -lh bin/ || echo "bin/ directory not found or empty"
          echo "=== All APK files found ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK files found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhanzAcademy-Debug-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
